<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>入室番号 更新フォーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6F0;
    --surface:#FFFFFF;
    --ink:#24304A;
    --ink-soft:#5C6B8A;
    --line:#E7E0D4;
    --accent:#E8632C;
    --accent-dark:#C94F1E;
    --accent-soft:#FCE4D6;
    --success:#2F8F6B;
    --success-soft:#DFF1E8;
    --danger:#D94F4F;
    --danger-soft:#FBE4E4;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans JP",system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    width:100%;
    max-width:420px;
  }
  header{
    margin-bottom:22px;
  }
  header .eyebrow{
    color:var(--accent-dark);
    font-weight:700;
    font-size:14px;
    letter-spacing:.02em;
  }
  h1{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:26px;
    line-height:1.3;
    margin:4px 0 6px;
  }
  header p{
    color:var(--ink-soft);
    font-size:14px;
    margin:0;
    line-height:1.6;
  }
  .card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    border:1px solid var(--line);
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:15px;
    font-weight:700;
    margin:0 0 12px;
    color:var(--ink);
  }
  .year-tabs{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .year-tab{
    flex:1;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink-soft);
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:14px;
    padding:10px 0;
    border-radius:var(--radius-sm);
    cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .year-tab.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }
  .class-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .class-btn{
    padding:14px 0;
    border-radius:var(--radius-sm);
    border:1.5px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:border-color .15s,background .15s,color .15s;
  }
  .class-btn.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .selected-label{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    padding:10px 14px;
    background:var(--accent-soft);
    border-radius:var(--radius-sm);
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:14px;
    color:var(--accent-dark);
    font-weight:700;
  }
  .selected-label span.floor{
    font-weight:500;
    color:var(--ink-soft);
  }
  .current-hint{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:10px;
    min-height:1.2em;
  }
  .current-hint.loading{
    opacity:.6;
  }
  .stepper{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:6px 0 4px;
  }
  .stepper button{
    width:56px;
    height:56px;
    border-radius:50%;
    border:none;
    background:var(--ink);
    color:#fff;
    font-size:26px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    flex-shrink:0;
  }
  .stepper button:active{
    background:var(--accent-dark);
  }
  .stepper input{
    width:120px;
    text-align:center;
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:44px;
    font-weight:900;
    border:none;
    background:transparent;
    color:var(--ink);
    -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .unit-label{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    margin-bottom:14px;
  }
  .note-box{
    text-align:center;
    background:var(--bg);
    border-radius:var(--radius-sm);
    padding:12px;
    font-size:13px;
    line-height:1.6;
    color:var(--ink-soft);
  }
  .note-box strong{
    color:var(--ink);
    font-family:"Zen Maru Gothic",sans-serif;
  }
  .submit-btn{
    width:100%;
    padding:16px 0;
    border:none;
    border-radius:var(--radius-md);
    background:var(--accent);
    color:#fff;
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:background .15s,opacity .15s;
  }
  .submit-btn:disabled{
    opacity:.55;
    cursor:default;
  }
  .submit-btn:not(:disabled):active{
    background:var(--accent-dark);
  }
  .message{
    margin-top:14px;
    padding:12px 14px;
    border-radius:var(--radius-sm);
    font-size:14px;
    font-weight:500;
    display:none;
  }
  .message.show{display:block;}
  .message.success{background:var(--success-soft);color:var(--success);}
  .message.error{background:var(--danger-soft);color:var(--danger);}
  footer{
    text-align:center;
    color:var(--ink-soft);
    font-size:12px;
    margin-top:10px;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">文化祭 受付用</div>
    <h1>入室番号を更新</h1>
    <p>自分のクラスを選んで、今入室してもらった整理券の番号を入力してください。</p>
  </header>

  <div class="card">
    <h2>クラスを選ぶ</h2>
    <div class="year-tabs">
      <button type="button" class="year-tab active" data-year="1">1年（1F）</button>
      <button type="button" class="year-tab" data-year="2">2年（2F）</button>
    </div>
    <div class="class-grid" id="classGrid"></div>
  </div>

  <div class="card">
    <h2>現在入室した整理券番号</h2>
    <div class="selected-label" id="selectedLabel">
      クラス未選択 <span class="floor" id="selectedFloor"></span>
    </div>
    <div class="current-hint" id="currentHint"></div>
    <div class="stepper">
      <button type="button" id="minusBtn" aria-label="1つ戻す">−</button>
      <input type="number" id="numberInput" min="0" max="999" value="0" inputmode="numeric">
      <button type="button" id="plusBtn" aria-label="次の番号へ">＋</button>
    </div>
    <div class="unit-label">番</div>
    <div class="note-box" id="noteBox">
      次に入室する番号　<strong id="nextNumber">1番</strong><br>
      <span style="font-size:12px;">（0 = まだ誰も入室していない状態）</span>
    </div>
  </div>

  <button type="button" class="submit-btn" id="submitBtn" disabled>この内容で更新する</button>
  <div class="message" id="message"></div>

  <footer>入室してもらうたびに「＋」で次の番号にして更新してください</footer>
</div>

<script>
  // ここをGASのWebアプリURL（/exec で終わるもの）に差し替えてください
  const GAS_URL = "https://script.google.com/macros/s/AKfycbznxM7bkSheEYGq6_OE3jWZKhoYDgTy9eC5zbCX55JS1LcFwANejFVPmS3Xj9Z4tUc/exec";

  const MAX_NUMBER = 999;
  const classGrid = document.getElementById('classGrid');
  const yearTabs = document.querySelectorAll('.year-tab');
  const selectedLabel = document.getElementById('selectedLabel');
  const numberInput = document.getElementById('numberInput');
  const nextNumber = document.getElementById('nextNumber');
  const submitBtn = document.getElementById('submitBtn');
  const messageBox = document.getElementById('message');
  const currentHint = document.getElementById('currentHint');

  let currentYear = "1";
  let selectedClass = null;
  let classDataMap = {};
  let classDataLoaded = false;

  function formatTime(iso){
    if(!iso) return "";
    const d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    return d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  }

  function describeCurrent(num, updatedAt){
    const time = formatTime(updatedAt);
    const base = num === 0 ? "現在の登録値: まだ入室なし" : `現在の登録値: ${num}番`;
    return time ? `${base}（${time} 更新）` : base;
  }

  async function fetchCurrentStatus(){
    currentHint.textContent = "現在の登録値を取得中…";
    currentHint.classList.add('loading');
    try{
      const res = await fetch(GAS_URL, { method: "GET" });
      const data = await res.json();
      if(data.status === "success"){
        classDataMap = {};
        data.classes.forEach(c => { classDataMap[c.className] = c; });
        classDataLoaded = true;
      }
    } catch(err){
      // 取得に失敗しても入力自体はできるようにする（0からの入力にフォールバック）
    } finally {
      currentHint.classList.remove('loading');
      if(selectedClass) applyCurrentValue(selectedClass);
      else currentHint.textContent = "";
    }
  }

  function applyCurrentValue(cls){
    const info = classDataMap[cls];
    if(info){
      numberInput.value = info.currentNumber;
      currentHint.textContent = describeCurrent(info.currentNumber, info.updatedAt);
    } else if(classDataLoaded){
      numberInput.value = 0;
      currentHint.textContent = "現在の登録値: データなし（0として入力できます）";
    } else {
      numberInput.value = 0;
      currentHint.textContent = "";
    }
    updateNextNumber();
  }

  function classesForYear(year){
    const list = [];
    for(let i = 1; i <= 9; i++) list.push(`${year}-${i}`);
    return list;
  }

  function floorForYear(year){
    return year === "1" ? "1F" : "2F";
  }

  function renderClassGrid(){
    classGrid.innerHTML = "";
    classesForYear(currentYear).forEach(cls => {
      const btn = document.createElement('button');
      btn.type = "button";
      btn.className = "class-btn";
      btn.textContent = cls;
      if(cls === selectedClass) btn.classList.add('selected');
      btn.addEventListener('click', () => selectClass(cls));
      classGrid.appendChild(btn);
    });
  }

  function selectClass(cls){
    selectedClass = cls;
    const year = cls.split('-')[0];
    selectedLabel.innerHTML = `${cls}組 <span class="floor">${floorForYear(year)}</span>`;
    try{ localStorage.setItem('congestion_selected_class', cls); }catch(e){}
    renderClassGrid();
    updateSubmitState();
    applyCurrentValue(cls);
  }

  function getNumber(){
    const n = parseInt(numberInput.value, 10);
    return isNaN(n) ? 0 : Math.max(0, Math.min(MAX_NUMBER, n));
  }

  function updateNextNumber(){
    nextNumber.textContent = `${Math.min(MAX_NUMBER, getNumber() + 1)}番`;
  }

  function updateSubmitState(){
    submitBtn.disabled = !selectedClass;
  }

  yearTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      yearTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentYear = tab.dataset.year;
      renderClassGrid();
    });
  });

  document.getElementById('minusBtn').addEventListener('click', () => {
    numberInput.value = Math.max(0, getNumber() - 1);
    updateNextNumber();
  });
  document.getElementById('plusBtn').addEventListener('click', () => {
    numberInput.value = Math.min(MAX_NUMBER, getNumber() + 1);
    updateNextNumber();
  });
  numberInput.addEventListener('input', () => {
    if(numberInput.value === "") return;
    numberInput.value = getNumber();
    updateNextNumber();
  });

  function showMessage(text, type){
    messageBox.textContent = text;
    messageBox.className = `message show ${type}`;
  }

  submitBtn.addEventListener('click', async () => {
    if(!selectedClass) return;
    const number = getNumber();
    numberInput.value = number;
    submitBtn.disabled = true;
    submitBtn.textContent = "更新中…";
    messageBox.className = "message";

    try{
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ class: selectedClass, number: number })
      });
      const data = await res.json();
      if(data.success){
        const label = number === 0 ? "入室なし（0）" : `${number}番`;
        showMessage(`${selectedClass}組の入室番号を${label}に更新しました`, "success");
        const nowIso = new Date().toISOString();
        classDataMap[selectedClass] = {
          className: selectedClass,
          floor: floorForYear(selectedClass.split('-')[0]),
          currentNumber: number,
          updatedAt: nowIso
        };
        currentHint.textContent = describeCurrent(number, nowIso);
      } else {
        showMessage(data.message || "更新に失敗しました", "error");
      }
    } catch(err){
      showMessage("通信エラーが発生しました。もう一度お試しください", "error");
    } finally {
      submitBtn.disabled = !selectedClass;
      submitBtn.textContent = "この内容で更新する";
    }
  });

  // 初期化：前回選択したクラスを復元
  let savedClass = null;
  try{ savedClass = localStorage.getItem('congestion_selected_class'); }catch(e){}
  if(savedClass){
    currentYear = savedClass.split('-')[0];
    yearTabs.forEach(t => t.classList.toggle('active', t.dataset.year === currentYear));
    selectedClass = savedClass;
    selectedLabel.innerHTML = `${savedClass}組 <span class="floor">${floorForYear(currentYear)}</span>`;
    updateSubmitState();
  }
  renderClassGrid();
  updateNextNumber();
  fetchCurrentStatus();
</script>
</body>
</html>
