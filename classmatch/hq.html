<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本部用 リーグ表・結果一覧</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="t">クラスマッチ ドッチボール</h1>
    <span class="role">本部用</span>
    <nav><a href="#leagues">リーグ表</a><a href="#bracket">決勝・3位決定戦</a><a href="#results">全結果</a><a href="referee.html">審判ページ</a></nav>
  </header>
  <div id="banner"></div>
  <div id="net"></div>
  <div class="tools">
    <span id="progress"></span>
    <span id="upd"></span>
    <button id="reload" type="button">今すぐ更新</button>
    <label><input type="checkbox" id="auto" checked> 自動更新</label>
    <span id="err" class="err"></span>
  </div>

  <section class="block" id="leagues"><h2 class="sec">リーグ戦</h2>
    <p class="legend"><span class="w">○</span> 勝ち　<span class="l">●</span> 負け　<span class="d">△</span> 引き分け　／　線の上の数字は スコア　／　色が付いた組は 決勝または3位決定戦に進む順位</p>
    <div class="leagues" id="lg"></div></section>
  <section class="block" id="bracket"><h2 class="sec">決勝・3位決定戦</h2><div id="br"></div></section>
  <section class="block" id="results"><h2 class="sec">全試合の結果</h2><div class="scroll" id="rs"></div></section>
  <p class="rules" id="rules"></p>
  <div id="offline" class="offline"></div>
</div>
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>')</script>
<script src="common.js"></script>
<script src="hq.js"></script>
</body>
</html>
